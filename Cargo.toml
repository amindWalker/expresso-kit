[workspace]
members = ["crates/expresso-kit"]
default-members = ["crates/expresso-kit"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Breno Rocha <bhrochamail@gmail.com>"]
license = "MIT"
repository = "https://github.com/amindWalker/expresso-kit"
readme = "../../README.md"
keywords = ["rust", "tui", "cli", "git", "docker-compose", "project", "environment", "validator"]
categories = ["command-line-utilities", "development-tools", "automation", "devops", "validator"]
description = "EspressoKit is an automated project validator. It validates repositories configuration for local/cloud environments with tests against a CI deployment to guarantee idempotent and reproducible results every time, ensuring easier development, high QoL and great DX"
rust-version = "1.92.0"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# These lints are for robustness, code quality, and functional style
# https://doc.rust-lang.org/rustc/lints/listing/index.html
# https://rust-lang.github.io/rust-clippy/master/index.html
[workspace.lints.rust]
unsafe_code = "forbid"
# Promote warnings to errors
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_mut = "deny"
unreachable_patterns = "deny"
rust_2024_compatibility = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# Lint groups (all includes correctness, suspicious, complexity, perf)
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Pedantic trade-offs (complexity/docs)
module_name_repetitions = "allow"
similar_names = "allow"
too_many_lines = "allow"
cognitive_complexity = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
significant_drop_tightening = "allow"
future_not_send = "allow"

# Style preferences
items_after_statements = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
redundant_pub_crate = "allow"
cast_possible_truncation = "allow"
cast_lossless = "allow"
missing_const_for_fn = "allow"
uninlined_format_args = "allow"
unnecessary_wraps = "allow"
ignored_unit_patterns = "allow"
if_not_else = "allow"
equatable_if_let = "allow"
literal_string_with_formatting_args = "allow"
case_sensitive_file_extension_comparisons = "allow"
unnecessary_debug_formatting = "allow"
unused_self = "allow"
implicit_hasher = "allow"
multiple_crate_versions = "allow"  # Transitive deps
format_push_string = "allow"

# Functional style - let clippy suggest improvements:
# option_if_let_else - suggests map_or_else (more functional)
# match_same_arms - suggests combining arms
# implicit_hasher - suggests generic hashers
# format_push_string - suggests write! macro
# assigning_clones - suggests clone_from
# map_unwrap_or - suggests map_or
# elidable_lifetime_names - suggests elision

[workspace.dependencies]
expresso-kit = { path = "crates/expresso-kit" }
tokio = { version = "1.48.0", features = ["full"] }
clap = { version = "4.5.53", features = ["derive"] }
color-eyre = "0.6.5"
ratatui = "0.29.0"
rand = "0.9.2"
chrono = "0.4.42"
futures = "0.3.31"
anyhow = "1"
parking_lot = "0.12"
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
serde_yml = "0.0.12"
