# Nix CI Workflow for expresso-kit
# Mirrors nixpkgs CI checks to ensure PR approval
#
# This workflow runs the same checks that nixpkgs CI runs:
# - Package builds on all platforms (x86_64-linux, aarch64-linux, x86_64-darwin, aarch64-darwin)
# - Flake checks (build, clippy, fmt)
# - Package evaluation
# - Meta validation

name: Nix CI (nixpkgs-compatible)

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run with debug logging'
        required: false
        default: false

env:
  # Ensure reproducible builds
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    accept-flake-config = true
    sandbox = false

jobs:
  # ============================================================
  # Job 1: Flake structure and evaluation checks
  # This mirrors: nix flake check
  # ============================================================
  nix-flake-check:
    name: Flake Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        if: ${{ !env.ACT }}

      - name: Check flake metadata
        run: nix flake metadata

      - name: Check flake outputs
        run: nix flake show

      - name: Run flake checks
        run: nix flake check --print-build-logs

  # ============================================================
  # Job 2: Build on Linux (x86_64 and aarch64)
  # This mirrors: nixpkgs hydra builds
  # ============================================================
  nix-build-linux:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            arch: aarch64
            system: aarch64-linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        if: ${{ !env.ACT }}

      - name: Build package
        run: |
          echo "Building for ${{ matrix.system }}..."
          nix build .#expresso-kit --print-build-logs

      - name: Test binary
        run: |
          ./result/bin/expresso-kit --version
          ./result/bin/expresso-kit --help

      - name: Run package tests
        run: |
          # Run basic functionality tests
          ./result/bin/expresso-kit check-deps --format json
          ./result/bin/expresso-kit validate --path . --files-only --required-files "Cargo.toml,README.md" --format text || true

      - name: Check binary size
        run: |
          ls -lh ./result/bin/expresso-kit
          file ./result/bin/expresso-kit

  # ============================================================
  # Job 3: Build on macOS (x86_64 and aarch64)
  # This mirrors: nixpkgs darwin builds
  # ============================================================
  nix-build-darwin:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            arch: x86_64
            system: x86_64-darwin
          - runner: macos-14
            arch: aarch64
            system: aarch64-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        if: ${{ !env.ACT }}

      - name: Build package
        run: |
          echo "Building for ${{ matrix.system }}..."
          nix build .#expresso-kit --print-build-logs

      - name: Test binary
        run: |
          ./result/bin/expresso-kit --version
          ./result/bin/expresso-kit --help

      - name: Check binary size
        run: |
          ls -lh ./result/bin/expresso-kit
          file ./result/bin/expresso-kit

  # ============================================================
  # Job 4: Validate package.nix for nixpkgs PR
  # This checks the standalone package definition
  # ============================================================
  nix-package-validation:
    name: Validate nixpkgs Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        if: ${{ !env.ACT }}

      - name: Validate package.nix syntax
        run: |
          nix-instantiate --parse packaging/nix/package.nix > /dev/null
          echo "✓ package.nix syntax is valid"

      - name: Check package evaluation
        run: |
          # Evaluate the package without building
          nix eval --json .#packages.x86_64-linux.expresso-kit.meta
          echo "✓ Package evaluation successful"

      - name: Validate meta attributes
        run: |
          echo "Checking required meta attributes..."

          # Extract meta as JSON
          META=$(nix eval --json .#packages.x86_64-linux.expresso-kit.meta)

          # Check description exists and is reasonable length
          DESC=$(echo "$META" | jq -r '.description // empty')
          if [ -z "$DESC" ]; then
            echo "✗ meta.description is missing"
            exit 1
          fi
          DESC_LEN=${#DESC}
          if [ $DESC_LEN -gt 80 ]; then
            echo "⚠ meta.description is ${DESC_LEN} chars (recommended: <80)"
          fi
          echo "✓ meta.description: $DESC"

          # Check homepage
          HOMEPAGE=$(echo "$META" | jq -r '.homepage // empty')
          if [ -z "$HOMEPAGE" ]; then
            echo "✗ meta.homepage is missing"
            exit 1
          fi
          echo "✓ meta.homepage: $HOMEPAGE"

          # Check license
          LICENSE=$(echo "$META" | jq -r '.license.spdxId // .license.shortName // empty')
          if [ -z "$LICENSE" ]; then
            echo "✗ meta.license is missing"
            exit 1
          fi
          echo "✓ meta.license: $LICENSE"

          # Check mainProgram
          MAIN=$(echo "$META" | jq -r '.mainProgram // empty')
          if [ -z "$MAIN" ]; then
            echo "⚠ meta.mainProgram is not set"
          else
            echo "✓ meta.mainProgram: $MAIN"
          fi

          # Check platforms
          PLATFORMS=$(echo "$META" | jq -r '.platforms | length')
          echo "✓ meta.platforms: ${PLATFORMS} platforms defined"

          echo ""
          echo "All required meta attributes are present!"

      - name: Check for common nixpkgs issues
        run: |
          echo "Checking for common nixpkgs PR issues..."

          # Check if Cargo.lock exists (required for reproducibility)
          if [ ! -f Cargo.lock ]; then
            echo "✗ Cargo.lock is missing (required for cargoLock)"
            exit 1
          fi
          echo "✓ Cargo.lock exists"

          # Check LICENSE file
          if [ ! -f LICENSE ]; then
            echo "✗ LICENSE file is missing"
            exit 1
          fi
          echo "✓ LICENSE file exists"

          # Verify license matches meta
          if grep -q "MIT" LICENSE; then
            echo "✓ LICENSE contains MIT"
          else
            echo "⚠ LICENSE might not match meta.license"
          fi

          echo ""
          echo "All common issues checked!"

  # ============================================================
  # Job 5: Code quality checks (mirrors nixpkgs requirements)
  # ============================================================
  nix-code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        if: ${{ !env.ACT }}

      - name: Check Rust formatting
        run: |
          nix develop -c cargo fmt --check
          echo "✓ Rust code is properly formatted"

      - name: Run Clippy
        run: |
          nix develop -c cargo clippy --all-targets -- -D warnings
          echo "✓ Clippy checks passed"

      - name: Check Nix formatting
        run: |
          # Check flake.nix formatting
          nix fmt -- --check flake.nix || echo "⚠ flake.nix could use formatting"

          # Check other nix files if nixfmt is available
          if command -v nixfmt &> /dev/null; then
            find . -name "*.nix" -exec nixfmt --check {} \; || echo "⚠ Some .nix files could use formatting"
          fi

  # ============================================================
  # Job 6: Generate nixpkgs PR summary
  # ============================================================
  nix-pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [nix-flake-check, nix-build-linux, nix-build-darwin, nix-package-validation, nix-code-quality]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate PR checklist
        run: |
          echo "# nixpkgs PR Readiness Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Flake check status
          if [ "${{ needs.nix-flake-check.result }}" == "success" ]; then
            echo "- ✅ Flake checks passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Flake checks failed" >> $GITHUB_STEP_SUMMARY
          fi

          # Linux build status
          if [ "${{ needs.nix-build-linux.result }}" == "success" ]; then
            echo "- ✅ Linux builds passed (x86_64, aarch64)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Linux builds failed" >> $GITHUB_STEP_SUMMARY
          fi

          # Darwin build status
          if [ "${{ needs.nix-build-darwin.result }}" == "success" ]; then
            echo "- ✅ macOS builds passed (x86_64, aarch64)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ macOS builds failed" >> $GITHUB_STEP_SUMMARY
          fi

          # Package validation status
          if [ "${{ needs.nix-package-validation.result }}" == "success" ]; then
            echo "- ✅ Package validation passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Package validation failed" >> $GITHUB_STEP_SUMMARY
          fi

          # Code quality status
          if [ "${{ needs.nix-code-quality.result }}" == "success" ]; then
            echo "- ✅ Code quality checks passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Code quality checks failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Next Steps for nixpkgs PR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Calculate source hash: \`./packaging/build-nix.sh --hash\`" >> $GITHUB_STEP_SUMMARY
          echo "2. Update \`packaging/nix/package.nix\` with the correct hash" >> $GITHUB_STEP_SUMMARY
          echo "3. Copy to nixpkgs: \`pkgs/by-name/ex/expresso-kit/package.nix\`" >> $GITHUB_STEP_SUMMARY
          echo "4. Commit message: \`expresso-kit: init at $(grep 'version = ' Cargo.toml | head -1 | cut -d'\"' -f2)\`" >> $GITHUB_STEP_SUMMARY
